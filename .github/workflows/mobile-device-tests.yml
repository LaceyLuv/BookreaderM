name: BookReader Mobile Device Tests
on:
  push:
    paths:
      - 'androidApp/**'
      - 'shared/**'
      - 'fixtures/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'lint.xml'
      - 'gradlew*'
      - 'scripts/**'
      - '.github/workflows/mobile-device-tests.yml'
  pull_request:
    paths:
      - 'androidApp/**'
      - 'shared/**'
      - 'fixtures/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'lint.xml'
      - 'gradlew*'
      - 'scripts/**'
      - '.github/workflows/mobile-device-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  instrumentation:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17.0.16+8'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          cmdline-tools-version: '13114758' # command-line tools 19.0
          packages: platform-tools
      - name: Install compile SDK and build tools
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'
      - name: Enable KVM and require acceleration
        run: |
          test -c /dev/kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Run actual Android instrumentation on API 36
        uses: reactivecircus/android-emulator-runner@1dcd0090116d15e7c562f8db72807de5e036a4ed # v2.34.0
        env:
          BOOKREADER_CAPTURE_FIXTURE_SCREENSHOTS: 'true'
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 2048M
          heap-size: 512M
          emulator-build: '15917651' # stable 37.1.11, official repository2-3.xml
          emulator-boot-timeout: 600
          disable-linux-hw-accel: false
          disable-animations: true
          disable-spellchecker: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none -accel on
          script: ./scripts/device-check.sh
      - name: Upload device identity, commands and instrumentation reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mobile-device-evidence
          if-no-files-found: error
          path: |
            build/device-evidence/
            androidApp/build/outputs/androidTest-results/
            androidApp/build/reports/androidTests/
