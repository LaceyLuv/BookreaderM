name: BookReader Mobile M00
on:
  push:
    paths:
      - 'androidApp/**'
      - 'shared/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'gradlew*'
      - 'scripts/**'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    paths:
      - 'androidApp/**'
      - 'shared/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'gradlew*'
      - 'scripts/**'
      - '.github/workflows/mobile-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17.0.16+8'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          cmdline-tools-version: '13114758' # command-line tools 19.0
          packages: platform-tools
      - name: Install pinned Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'
      - name: Validate environment and run mandatory checks
        run: ./scripts/ci-check.sh
      - name: Upload APK, test reports and command evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mobile-m00-evidence
          if-no-files-found: error
          path: |
            build/ci-evidence/
            androidApp/build/outputs/apk/
            androidApp/build/reports/
            androidApp/build/test-results/
            shared/build/reports/
            shared/build/test-results/
            shared/schemas/
